name: Update FiveM Natives

on:
  schedule:
    - cron: "0 0 */3 * *" # every 3 days at midnight UTC
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history needed for tagging

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run natives builder
        run: bun run build

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet NATIVES_HASH 2>/dev/null || [ ! -f NATIVES_HASH ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          # Also check if docs/ changed
          if git diff --quiet docs/ 2>/dev/null; then
            echo "docs_changed=false" >> $GITHUB_OUTPUT
          else
            echo "docs_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and tag natives update
        if: steps.changes.outputs.changed == 'true' || steps.changes.outputs.docs_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DATE=$(date -u +%Y%m%d)
          TAG="natives-${DATE}"

          git add docs/ NATIVES_HASH .etag-cache 2>/dev/null || true
          git commit -m "chore(natives): update natives ${DATE}"

          # Only create tag if it doesn't already exist
          if ! git tag --list | grep -q "^${TAG}$"; then
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

          git push origin HEAD

      - name: No changes detected
        if: steps.changes.outputs.changed == 'false' && steps.changes.outputs.docs_changed == 'false'
        run: echo "No native changes detected. Skipping commit."
